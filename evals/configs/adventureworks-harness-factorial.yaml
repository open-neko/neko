schema_version: openneko.eval/v1
id: adventureworks-harness-factorial
description: Full 2×2 backend/data-path experiment with matched Anthropic outer models and one externally provisioned GraphJin inner model.
adapter: adventureworks.metric
semantics:
  ref: ../semantics.yaml
pricing:
  ref: ../pricing/standard-2026-07-09.yaml

suite:
  ref: ../suites/adventureworks-metric-20q.yaml

datasets:
  - ref: ../datasets/adventureworks/dataset.yaml
    snapshot: full

defaults:
  repetitions: 3
  timeout: 10m
  execution_order: counterbalanced
  concurrency: 1
  cache_state: warm
  content_capture: metadata
  max_attempts: 2

variants:
  - id: hermes-anthropic-direct
    backend: hermes
    outer_model:
      provider: anthropic
      model: claude-opus-4-7
      credential_ref: env:ANTHROPIC_API_KEY
    data_path: graphjin-direct

  - id: claude-agent-anthropic-direct
    extends: hermes-anthropic-direct
    backend: claude-agent

  - id: hermes-anthropic-delegated
    extends: hermes-anthropic-direct
    data_path: graphjin-agent
    inner_model:
      provider: google-gemini
      model: gemini-3.6-flash
      credential_ref: env:GEMINI_API_KEY
      config:
        provisioning: external-graphjin

  - id: claude-agent-anthropic-delegated
    extends: hermes-anthropic-delegated
    backend: claude-agent

budgets:
  max_wall_time: 48h
  max_estimated_cost_usd: 500

artifacts:
  check_in: scored
  raw_dir: .openneko/evals/raw
  state_dir: .openneko/evals/state
  results_dir: evals/results
