schema_version: openneko.eval/v1
id: openneko-backend-scripted-good-v2
description: Provider-free passing walking skeleton for all OpenNeko backend v2 cases.
adapter: openneko.work-backend
semantics: { ref: ../semantics.yaml }
suite: { ref: ../suites/openneko-backend-v2.yaml }
datasets:
  - ref: ../datasets/openneko-backend/dataset.yaml
    snapshot: v1
defaults:
  repetitions: 1
  timeout: 2m
  execution_order: declared
  concurrency: 1
  cache_state: cold
  content_capture: metadata
  max_attempts: 1
variants:
  - id: scripted-good
    backend: scripted-good
    outer_model: { provider: scripted, model: deterministic-v1 }
    data_path: graphjin-direct
    settings: { scripted_outcome: pass, max_tool_calls: 30 }
artifacts:
  check_in: none
  raw_dir: ../../.openneko/evals/raw
  state_dir: ../../.openneko/evals/state
  results_dir: ../../evals/results
