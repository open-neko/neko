schema_version: openneko.eval.dataset/v1
id: adventureworks
version: 1.0.0
description: AdventureWorks OLTP sample data for grounded OpenNeko harness evaluations.
license: Microsoft AdventureWorks sample database

capabilities:
  - aggregate.count
  - aggregate.average
  - aggregate.distinct
  - aggregate.rank
  - aggregate.ratio
  - aggregate.sum
  - date.anchor
  - date.window
  - filter.boolean
  - filter.numeric
  - production.products
  - production.work-orders
  - purchasing.order-lines
  - purchasing.orders
  - relation.join
  - sales.customers
  - sales.order-lines
  - sales.orders
  - sales.territories

snapshots:
  - id: full
    description: Full AdventureWorks sample loaded by compose.adventureworks.yml.
    seed: 1

connection:
  agent_graphql_ref: env:OPENNEKO_EVAL_ADVENTUREWORKS_GRAPHQL_URL
  agent_mcp_ref: env:OPENNEKO_EVAL_ADVENTUREWORKS_MCP_URL
  oracle_database_ref: env:OPENNEKO_EVAL_ADVENTUREWORKS_DATABASE_URL
  defaults:
    agent_graphql_url: http://127.0.0.1:8080/api/v1/graphql
    agent_mcp_url: http://127.0.0.1:8080/api/v1/mcp
    oracle_database_url: postgresql://postgres:postgres@127.0.0.1:5433/adventureworks

anchor_policy:
  kind: data-derived
  description: Each oracle anchors to the maximum sales.salesorderheader.orderdate.
