schema_version: openneko.eval.case/v1
id: q02
version: 1.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.count, date.anchor, sales.orders]
difficulty: filter
semantics: [CALC-SCALAR, CALC-FILTER, CALC-TIME, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: COO
  slug: latest-sales-day-orders
  title: Orders placed on the latest sales date
  why: Find the latest sales.salesorderheader.orderdate in live data. The single headline number must be the count of orders whose orderdate is exactly that calendar date, including every timestamp on that date. Compare it with the immediately preceding calendar day.
  chart_hint: kpi
oracle:
  kind: sql.metric
  ref: ../oracles/q02.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: day }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
