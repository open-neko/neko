schema_version: openneko.eval.case/v1
id: q02
version: 2.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.count, date.anchor, sales.orders]
difficulty: filter
semantics: [CALC-SCALAR, CALC-FILTER, CALC-TIME, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: COO
  question: On the most recent day represented in our sales data, how many orders were placed, compared with the previous calendar day?
oracle:
  kind: sql.metric
  ref: ../oracles/q02.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: baseline-value
    dimension: ground_truth
    kind: numeric.baseline-relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: day }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
