schema_version: openneko.eval.case/v1
id: q03
version: 2.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.count, date.anchor, date.window, sales.orders]
difficulty: filter
semantics: [CALC-SCALAR, CALC-FILTER, CALC-TIME, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: COO
  question: How many sales orders were placed in the latest 30 days in our data, compared with the 30 days immediately before that?
oracle:
  kind: sql.metric
  ref: ../oracles/q03.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: baseline-value
    dimension: ground_truth
    kind: numeric.baseline-relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: month }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
