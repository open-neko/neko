schema_version: openneko.eval.case/v1
id: q03
version: 1.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.count, date.anchor, date.window, sales.orders]
difficulty: filter
semantics: [CALC-SCALAR, CALC-FILTER, CALC-TIME, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: COO
  slug: last-30-days-orders
  title: Order count in the latest 30 calendar days
  why: Anchor to the latest sales.salesorderheader.orderdate. The single headline number must count orders in the inclusive 30-calendar-day window from anchor minus 29 days through the anchor. Compare it with the immediately preceding non-overlapping 30-day window.
  chart_hint: kpi
oracle:
  kind: sql.metric
  ref: ../oracles/q03.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: month }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
