schema_version: openneko.eval.case/v1
id: q19
version: 2.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.sum, date.anchor, date.window, relation.join, purchasing.order-lines, purchasing.orders]
difficulty: join
semantics: [CALC-SCALAR, CALC-TIME, CALC-JOIN, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: COO
  question: How many units were rejected on our purchase-order lines over the latest 12 months in our data, compared with the preceding 12 months?
oracle:
  kind: sql.metric
  ref: ../oracles/q19.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: baseline-value
    dimension: ground_truth
    kind: numeric.baseline-relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: year }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
