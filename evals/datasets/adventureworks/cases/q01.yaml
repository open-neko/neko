schema_version: openneko.eval.case/v1
id: q01
version: 1.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.count, date.anchor, date.window, sales.orders]
difficulty: filter
semantics: [CALC-SCALAR, CALC-FILTER, CALC-TIME, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: CFO
  slug: order-volume-trend
  title: Trailing 12-month total order count
  why: Anchor to the latest sales.salesorderheader.orderdate in live data. The single headline number must be the count of sales orders in the inclusive 365-calendar-day window ending on that date. Compare it with the immediately preceding non-overlapping 365-day window.
  chart_hint: kpi
oracle:
  kind: sql.metric
  ref: ../oracles/q01.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: year }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
