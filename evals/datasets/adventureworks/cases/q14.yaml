schema_version: openneko.eval.case/v1
id: q14
version: 1.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.count, filter.numeric, date.anchor, date.window, relation.join, sales.order-lines, sales.orders]
difficulty: join
semantics: [CALC-SCALAR, CALC-TIME, CALC-JOIN, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: CRO
  slug: ttm-discounted-lines
  title: "Discounted sales line items in the trailing 12 months"
  why: "Join sales.salesorderdetail to sales.salesorderheader by salesorderid and anchor to the latest header orderdate. The single headline number must count detail rows with unitpricediscount greater than zero for orders in the inclusive 365-day window ending on the anchor. Compare it with the preceding non-overlapping 365-day window."
  chart_hint: kpi
oracle:
  kind: sql.metric
  ref: ../oracles/q14.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: year }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
