schema_version: openneko.eval.case/v1
id: q31
version: 1.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.average, date.anchor, date.window, purchasing.orders]
difficulty: aggregate
semantics: [CALC-SCALAR, CALC-TIME, CALC-BUSINESS, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: CFO
  question: What was our average purchase-order total, including tax and freight, over the latest 12 months in our data, compared with the preceding 12 months?
oracle:
  kind: sql.metric
  ref: ../oracles/q31.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: baseline-value
    dimension: ground_truth
    kind: numeric.baseline-relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: year }
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
