schema_version: openneko.eval.case/v1
id: q24
version: 1.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.rank, aggregate.sum, date.anchor, date.window, relation.join, sales.orders, sales.territories]
difficulty: grouped-rank
semantics: [CALC-SCALAR, CALC-TIME, CALC-JOIN, CALC-RANK, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: CEO
  question: Which geographic territory group, such as North America, Europe, or Pacific, generated the highest total order value, including tax and freight, over the latest 12 months in our data? Give me the amount and compare that group with the preceding 12 months.
oracle:
  kind: sql.metric
  ref: ../oracles/q24.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: baseline-value
    dimension: ground_truth
    kind: numeric.baseline-relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: year }
  - id: winning-dimension
    dimension: ground_truth
    kind: dimension.contains
    gate: true
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
