schema_version: openneko.eval.case/v1
id: q16
version: 2.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.rank, aggregate.sum, date.anchor, date.window, relation.join, production.products, sales.order-lines, sales.orders]
difficulty: grouped-rank
semantics: [CALC-SCALAR, CALC-TIME, CALC-JOIN, CALC-RANK, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: CPO
  question: Which product sold the most units over the latest 12 months in our data? Give me the unit count and compare that product with the preceding 12 months.
oracle:
  kind: sql.metric
  ref: ../oracles/q16.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: baseline-value
    dimension: ground_truth
    kind: numeric.baseline-relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: year }
  - id: winning-dimension
    dimension: ground_truth
    kind: dimension.contains
    gate: true
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
