schema_version: openneko.eval.case/v1
id: q16
version: 1.0.0
family: read
product_path: metric
dataset: adventureworks
capability_tags: [aggregate.rank, aggregate.sum, date.anchor, date.window, relation.join, production.products, sales.order-lines, sales.orders]
difficulty: grouped-rank
semantics: [CALC-SCALAR, CALC-TIME, CALC-JOIN, CALC-RANK, CALC-EVIDENCE, METRIC-REFRESH]
input:
  role: CPO
  slug: top-product-ttm-units
  title: "Units sold for the top product in the trailing 12 months"
  why: "Join sales.salesorderdetail to sales.salesorderheader, anchor to the latest header orderdate, group the inclusive 365-day window by productid, and rank by sum(orderqty). Join production.product for the name. The single headline number must be units for the winning product and the output must name it. Compare that same product's units in the preceding non-overlapping 365-day window."
  chart_hint: kpi
oracle:
  kind: sql.metric
  ref: ../oracles/q16.sql
assertions:
  - id: headline-value
    dimension: ground_truth
    kind: numeric.relative-error
    gate: true
    params: { max_relative_error: 0.01 }
  - id: exact-window
    dimension: ground_truth
    kind: time-window.exact
    gate: true
    params: { grain: year }
  - id: winning-dimension
    dimension: ground_truth
    kind: dimension.contains
    gate: true
  - id: metric-output
    dimension: behavior
    kind: metric.contract
    gate: true
  - id: latency
    dimension: efficiency
    kind: duration.under
    params: { max_ms: 600000 }
