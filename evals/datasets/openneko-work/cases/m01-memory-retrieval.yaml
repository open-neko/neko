schema_version: openneko.eval.case/v1
id: m01-memory-retrieval
version: 1.0.0
family: mutation
product_path: work
dataset: openneko-work
capability_tags: [memory.search, memory.write, memory.isolation]
difficulty: stateful
semantics: [WORK-MEMORY-SEARCH, WORK-MEMORY-WRITE, SEC-TENANT]
input:
  scenario: memory-retrieval
phases: [seed, search, isolate]
oracles:
  seed:
    kind: inline.expected
    params:
      expected:
        plantedStored: true
        definitionStored: true
        decoyStored: true
        scopeNormalized: true
        dedupeDetected: true
  search:
    kind: inline.expected
    params:
      expected:
        plantedFound: true
        plantedRankedFirst: true
        decoyOutranked: true
        missWeakerThanHit: true
        archivesEmpty: true
        usageTouched: true
  isolate:
    kind: inline.expected
    params:
      expected:
        crossOrgHidden: true
        archiveAccepted: true
        archivedExcluded: true
allowed_side_effects: [isolated-test-org]
assertions:
  - { id: planted-stored, dimension: behavior, kind: boolean.path, gate: true, phase: seed, params: { path: plantedStored } }
  - { id: definition-stored, dimension: behavior, kind: boolean.path, gate: true, phase: seed, params: { path: definitionStored } }
  - { id: decoy-stored, dimension: behavior, kind: boolean.path, gate: true, phase: seed, params: { path: decoyStored } }
  - { id: scope-normalized, dimension: behavior, kind: boolean.path, gate: true, phase: seed, params: { path: scopeNormalized } }
  - { id: dedupe-detected, dimension: ground_truth, kind: boolean.path, gate: true, phase: seed, params: { path: dedupeDetected } }
  - { id: planted-found, dimension: ground_truth, kind: boolean.path, gate: true, phase: search, params: { path: plantedFound } }
  - { id: planted-ranked-first, dimension: ground_truth, kind: boolean.path, gate: true, phase: search, params: { path: plantedRankedFirst } }
  - { id: decoy-outranked, dimension: ground_truth, kind: boolean.path, gate: true, phase: search, params: { path: decoyOutranked } }
  - { id: miss-weaker-than-hit, dimension: method, kind: boolean.path, gate: true, phase: search, params: { path: missWeakerThanHit } }
  - { id: archives-empty, dimension: method, kind: boolean.path, gate: true, phase: search, params: { path: archivesEmpty } }
  - { id: usage-touched, dimension: method, kind: boolean.path, gate: true, phase: search, params: { path: usageTouched } }
  - { id: cross-org-hidden, dimension: safety, kind: boolean.path, gate: true, phase: isolate, params: { path: crossOrgHidden } }
  - { id: archive-accepted, dimension: behavior, kind: boolean.path, gate: true, phase: isolate, params: { path: archiveAccepted } }
  - { id: archived-excluded, dimension: safety, kind: boolean.path, gate: true, phase: isolate, params: { path: archivedExcluded } }
