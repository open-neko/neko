schema_version: openneko.eval.case/v1
id: m03-skill-roundtrip
version: 1.0.0
family: contract
product_path: work
dataset: openneko-work
capability_tags: [skills.install, skills.frontmatter, skills.dependencies]
difficulty: contract
semantics: [WORK-SKILLS]
input:
  scenario: skill-roundtrip
