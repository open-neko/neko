  - { id: allowed-tools-parsed, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: allowedToolsParsed } }
  - { id: upsert-stable, dimension: behavior, kind: boolean.path, gate: true, params: { path: upsertStable } }
  - { id: escape-blocked, dimension: safety, kind: boolean.path, gate: true, params: { path: escapeBlocked } }
  - { id: bad-name-rejected, dimension: safety, kind: boolean.path, gate: true, params: { path: badNameRejected } }
  - { id: deps-aggregated, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: depsAggregated } }
  - { id: deps-deduped, dimension: behavior, kind: boolean.path, gate: true, params: { path: depsDeduped } }
