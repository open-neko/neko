schema_version: openneko.eval.case/v1
id: m02-memory-ablation
version: 1.0.0
family: mutation
product_path: work
dataset: openneko-work
capability_tags: [memory.search, memory.ablation]
difficulty: stateful
semantics: [WORK-MEMORY-SEARCH]
input:
  scenario: memory-ablation
phases: [with-memory, without-memory]
oracles:
  with-memory:
    kind: inline.expected
    params:
      expected:
        retrieved: true
        thresholdRecovered: true
        definitionRecovered: true
  without-memory:
    kind: inline.expected
    params:
      expected:
        nothingRetrieved: true
        honestMiss: true
allowed_side_effects: [isolated-test-org]
assertions:
  - { id: retrieved, dimension: ground_truth, kind: boolean.path, gate: true, phase: with-memory, params: { path: retrieved } }
  - { id: threshold-recovered, dimension: ground_truth, kind: boolean.path, gate: true, phase: with-memory, params: { path: thresholdRecovered } }
  - { id: definition-recovered, dimension: ground_truth, kind: boolean.path, gate: true, phase: with-memory, params: { path: definitionRecovered } }
  - { id: nothing-retrieved, dimension: ground_truth, kind: boolean.path, gate: true, phase: without-memory, params: { path: nothingRetrieved } }
  - { id: honest-miss, dimension: method, kind: boolean.path, gate: true, phase: without-memory, params: { path: honestMiss } }
