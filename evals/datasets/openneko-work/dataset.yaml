schema_version: openneko.eval.dataset/v1
id: openneko-work
version: 1.0.0
description: Isolated OpenNeko work fixtures for seeded-memory retrieval,
  memory lifecycle and isolation, capability ablation, and skill
  install/round-trip evaluation. The seeded corpus is the ground truth; the
  relevant/irrelevant partition is known by construction.
license: Apache-2.0
capabilities:
  - memory.search
  - memory.write
  - memory.isolation
  - memory.ablation
  - skills.install
  - skills.frontmatter
  - skills.dependencies
snapshots:
  - id: v1
    description: Migrated OpenNeko PostgreSQL schema plus per-episode isolated organizations and an in-process planted-memory corpus
    seed: 20260814
connection: {}
anchor_policy:
  kind: fixed
  value: "2026-01-01T00:00:00.000Z"
  description: Memory and skill state is isolated per episode and deterministic; no data clock is involved.
