schema_version: openneko.eval.case/v1
id: b11-composition
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [aggregate.rank, aggregate.sum, sales.territories, work.graphjin-direct, work.memory-search, work.skill-load, work.library-search, work.workflow-retrieve]
difficulty: composition
semantics: [DATA-DIRECT, CALC-RANK, WORK-MEMORY-SEARCH, WORK-SKILLS, WORK-LIBRARY-SEARCH, WORK-WORKFLOW-RETRIEVE]
input:
  scenario: composition
  treatment: present
  skill: aw-executive-composition
  workflow: territory-composition-review
  question: "Identify the highest-value sales territory over the 365-day window ending on the latest recorded sales-order date, with both endpoints included. Search memory and the library, load the aw-executive-composition skill, and inspect the territory-composition-review workflow. Apply the exact current code from each source; do not use legacy codes. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, Winner, and Context codes; omit labels that the request does not need."
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q15.sql
assertions:
  - { id: labelled-answer, dimension: behavior, kind: answer.labelled-contract, gate: true, params: { fields: [current_value, current_window, winner, context_codes] } }
  - { id: current-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: expectedValue, answer_field: current_value, max_relative_error: 0.01 } }
  - { id: winning-territory, dimension: ground_truth, kind: answer.oracle-dimension, gate: true, params: { answer_field: winner } }
  - { id: all-context-codes, dimension: ground_truth, kind: answer.all-fixture-sentinels, gate: true, params: { answer_field: context_codes, fixtures: [memory, skill, library, workflow] } }
  - { id: memory-search, dimension: method, kind: trace.memory-search, gate: true }
  - { id: skill-loaded, dimension: method, kind: trace.skill-loaded, gate: true, params: { skill: aw-executive-composition } }
  - { id: library-search, dimension: method, kind: trace.library-search, gate: true }
  - { id: workflows-listed, dimension: method, kind: trace.workflow-list, gate: true }
  - { id: direct-query, dimension: method, kind: trace.graphjin-execute, gate: true }
  - { id: all-decoys-excluded, dimension: safety, kind: answer.excludes-all-decoys, gate: true }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
