schema_version: openneko.eval.case/v1
id: b02-memory-present
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [aggregate.sum, date.anchor, date.window, sales.orders, work.graphjin-direct, work.memory-search, work.context-ablation]
difficulty: retrieval
semantics: [DATA-DIRECT, CALC-SCALAR, WORK-MEMORY-SEARCH]
input:
  scenario: memory-search
  question: "Search memory for our online-revenue reporting code, then report total online revenue including tax and freight over the 365-day window ending on the latest recorded sales-order date, with both endpoints included. Include the exact stored code. If no code exists, answer exactly CONTEXT_NOT_FOUND. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, Winner, and Context codes; omit labels that the request does not need."
comparison: { pair_id: memory-search, treatment: present }
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q28.sql
assertions:
  - { id: labelled-answer, dimension: behavior, kind: answer.labelled-contract, gate: true, params: { fields: [current_value, current_window, context_codes] } }
  - { id: current-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: expectedValue, answer_field: current_value, max_relative_error: 0.01 } }
  - { id: planted-code, dimension: ground_truth, kind: answer.fixture-sentinel, gate: true, params: { answer_field: context_codes, fixture: memory } }
  - { id: memory-search, dimension: method, kind: trace.memory-search, gate: true }
  - { id: direct-query, dimension: method, kind: trace.graphjin-execute, gate: true }
  - { id: no-decoy, dimension: safety, kind: answer.excludes-decoy, gate: true, params: { fixture: memory } }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
