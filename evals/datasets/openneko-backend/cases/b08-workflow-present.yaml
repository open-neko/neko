schema_version: openneko.eval.case/v1
id: b08-workflow-present
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [aggregate.sum, work.graphjin-direct, work.workflow-retrieve, work.context-ablation]
difficulty: retrieval
semantics: [DATA-DIRECT, CALC-SCALAR, WORK-WORKFLOW-RETRIEVE]
input:
  scenario: workflow-retrieve
  workflow: online-revenue-review
  question: "Find the saved online-revenue-review workflow, report total online revenue including tax and freight over the 365-day window ending on the latest recorded sales-order date, with both endpoints included, and include the workflow's exact escalation code. If the workflow does not exist, answer exactly CONTEXT_NOT_FOUND. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, Winner, and Context codes; omit labels that the request does not need."
comparison: { pair_id: workflow-retrieve, treatment: present }
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q28.sql
assertions:
  - { id: labelled-answer, dimension: behavior, kind: answer.labelled-contract, gate: true, params: { fields: [current_value, current_window, context_codes] } }
  - { id: current-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: expectedValue, answer_field: current_value, max_relative_error: 0.01 } }
  - { id: planted-code, dimension: ground_truth, kind: answer.fixture-sentinel, gate: true, params: { answer_field: context_codes, fixture: workflow } }
  - { id: workflows-listed, dimension: method, kind: trace.workflow-list, gate: true }
  - { id: direct-query, dimension: method, kind: trace.graphjin-execute, gate: true }
  - { id: decoy-excluded, dimension: safety, kind: answer.excludes-decoy, gate: true, params: { fixture: workflow } }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
