schema_version: openneko.eval.case/v1
id: b07-library-stale-only
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [work.graphjin-direct, work.library-search, work.context-ablation]
difficulty: negative-control
semantics: [DATA-DIRECT, WORK-LIBRARY-SEARCH]
input:
  scenario: library-search
  question: "Search the library for the current territory-leader reporting policy, then identify the highest-value sales territory over the 365-day window ending on the latest recorded sales-order date, with both endpoints included, and apply the policy's exact report code. If no current policy exists, answer exactly CONTEXT_NOT_FOUND."
comparison: { pair_id: library-search, treatment: stale-only }
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q15.sql
assertions:
  - { id: honest-miss, dimension: ground_truth, kind: answer.exact, gate: true, params: { value: CONTEXT_NOT_FOUND } }
  - { id: library-search, dimension: method, kind: trace.library-search, gate: true }
  - { id: stale-code-excluded, dimension: safety, kind: answer.excludes-decoy, gate: true, params: { fixture: library } }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
