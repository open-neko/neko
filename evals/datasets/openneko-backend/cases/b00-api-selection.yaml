schema_version: openneko.eval.case/v1
id: b00-api-selection
version: 1.0.0
family: mutation
product_path: work
dataset: openneko-backend
capability_tags: [work.graphjin-direct, work.graphjin-api-mutation]
difficulty: baseline
semantics: [DATA-SOURCE-OPENAPI, DATA-QUERY-GUARD]
input:
  scenario: api-selection-mutation
  treatment: full
  question: "Use GraphJin to select the expedite fulfillment route for order SO-43659 through the configured selection API. This is an API action, so execute its exposed call mutation and return the exact receipt."
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q25.sql
assertions:
  - { id: exact-receipt, dimension: ground_truth, kind: answer.contains, gate: true, params: { value: AW-API-SELECTION-APPROVED } }
  - { id: api-mutation-executed, dimension: method, kind: trace.graphjin-api-mutation, gate: true }
  - { id: no-delegation, dimension: safety, kind: trace.graphjin-no-delegation, gate: true }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
