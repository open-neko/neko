schema_version: openneko.eval.case/v1
id: b10-prefetched-memory
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [aggregate.sum, purchasing.orders, work.graphjin-direct, work.memory-prefetch]
difficulty: context-application
semantics: [DATA-DIRECT, CALC-SCALAR, WORK-MEMORY-SEARCH]
input:
  scenario: memory-prefetch
  treatment: present
  question: "Report the vendor with the highest purchase-order value over the 365-day window ending on the latest recorded purchase-order date, with both endpoints included, including tax and freight, and apply our stored vendor-review code. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, Winner, and Context codes; omit labels that the request does not need."
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q30.sql
assertions:
  - { id: labelled-answer, dimension: behavior, kind: answer.labelled-contract, gate: true, params: { fields: [current_value, current_window, winner, context_codes] } }
  - { id: current-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: expectedValue, answer_field: current_value, max_relative_error: 0.01 } }
  - { id: winning-vendor, dimension: ground_truth, kind: answer.oracle-dimension, gate: true, params: { answer_field: winner } }
  - { id: planted-code, dimension: ground_truth, kind: answer.fixture-sentinel, gate: true, params: { answer_field: context_codes, fixture: memory } }
  - { id: memory-prefetched, dimension: method, kind: trace.memory-prefetched, gate: true }
  - { id: direct-query, dimension: method, kind: trace.graphjin-execute, gate: true }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
