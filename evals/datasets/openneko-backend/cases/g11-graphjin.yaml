schema_version: openneko.eval.case/v1
id: g11-graphjin
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [aggregate.sum, date.anchor, date.window, relation.join, sales.order-lines, sales.orders, work.graphjin-direct]
difficulty: join
semantics: [DATA-DIRECT, DATA-QUERY-GUARD, CALC-SCALAR, CALC-TIME, CALC-JOIN, CALC-EVIDENCE, METRIC-REFRESH]
input:
  scenario: graphjin-direct
  treatment: full
  source_case: q11
  question: "For the COO: Use the latest date present in the records relevant to this question as the anchor. Every day-count window includes both endpoints; an immediately preceding window is non-overlapping and directly before it; and 12 months means 365 days. How many product units did we sell over the latest 12 months in our data, compared with the preceding 12 months? Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested."
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q11.sql
assertions:
  - { id: labelled-answer, dimension: behavior, kind: answer.labelled-contract, gate: true, params: { fields: [current_value, comparison_value, current_window] } }
  - { id: current-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: expectedValue, answer_field: current_value, max_relative_error: 0.01 } }
  - { id: comparison-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: baselineValue, answer_field: comparison_value, max_relative_error: 0.01 } }
  - { id: exact-window, dimension: ground_truth, kind: answer.window-exact, gate: true, params: { answer_field: current_window } }
  - { id: direct-query, dimension: method, kind: trace.graphjin-execute, gate: true }
  - { id: no-delegation, dimension: method, kind: trace.graphjin-no-delegation, gate: true }
  - { id: read-only-target-unchanged, dimension: safety, kind: trace.no-successful-mutation, gate: true }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
