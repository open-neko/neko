schema_version: openneko.eval.case/v1
id: b04-skill-present
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [aggregate.ratio, sales.orders, work.graphjin-direct, work.skill-load, work.context-ablation]
difficulty: tool-selection
semantics: [DATA-DIRECT, CALC-SCALAR, WORK-SKILLS]
input:
  scenario: skill-load
  skill: aw-tax-brief
  question: "Use the aw-tax-brief skill to report our effective sales tax rate over the 365-day window ending on the latest recorded sales-order date, with both endpoints included. Follow the skill's output rule exactly. If that skill is unavailable, answer exactly CONTEXT_NOT_FOUND. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, Winner, and Context codes; omit labels that the request does not need."
comparison: { pair_id: skill-load, treatment: present }
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q25.sql
assertions:
  - { id: labelled-answer, dimension: behavior, kind: answer.labelled-contract, gate: true, params: { fields: [current_value, current_window, context_codes] } }
  - { id: current-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: expectedValue, answer_field: current_value, max_relative_error: 0.01 } }
  - { id: planted-code, dimension: ground_truth, kind: answer.fixture-sentinel, gate: true, params: { answer_field: context_codes, fixture: skill } }
  - { id: skill-loaded, dimension: method, kind: trace.skill-loaded, gate: true, params: { skill: aw-tax-brief } }
  - { id: direct-query, dimension: method, kind: trace.graphjin-execute, gate: true }
  - { id: decoy-not-loaded, dimension: safety, kind: trace.skill-not-loaded, gate: true, params: { skill: aw-tax-brief-legacy } }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
