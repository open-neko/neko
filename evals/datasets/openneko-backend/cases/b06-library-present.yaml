schema_version: openneko.eval.case/v1
id: b06-library-present
version: 1.0.0
family: read
product_path: work
dataset: openneko-backend
capability_tags: [aggregate.rank, aggregate.sum, sales.territories, work.graphjin-direct, work.library-search, work.context-ablation]
difficulty: retrieval
semantics: [DATA-DIRECT, CALC-RANK, WORK-LIBRARY-SEARCH]
input:
  scenario: library-search
  question: "Search the library for the current territory-leader reporting policy, then identify the highest-value sales territory over the 365-day window ending on the latest recorded sales-order date, with both endpoints included, and apply the policy's exact report code. If no current policy exists, answer exactly CONTEXT_NOT_FOUND. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, Winner, and Context codes; omit labels that the request does not need."
comparison: { pair_id: library-search, treatment: present }
oracle:
  kind: sql.metric
  ref: ../../adventureworks/oracles/q15.sql
assertions:
  - { id: labelled-answer, dimension: behavior, kind: answer.labelled-contract, gate: true, params: { fields: [current_value, current_window, winner, context_codes] } }
  - { id: current-value, dimension: ground_truth, kind: answer.numeric-relative-error, gate: true, params: { oracle_field: expectedValue, answer_field: current_value, max_relative_error: 0.01 } }
  - { id: winning-territory, dimension: ground_truth, kind: answer.oracle-dimension, gate: true, params: { answer_field: winner } }
  - { id: planted-code, dimension: ground_truth, kind: answer.fixture-sentinel, gate: true, params: { answer_field: context_codes, fixture: library } }
  - { id: library-search, dimension: method, kind: trace.library-search, gate: true }
  - { id: direct-query, dimension: method, kind: trace.graphjin-execute, gate: true }
  - { id: stale-decoy-excluded, dimension: safety, kind: answer.excludes-decoy, gate: true, params: { fixture: library } }
  - { id: clean-answer, dimension: behavior, kind: answer.clean, gate: true }
