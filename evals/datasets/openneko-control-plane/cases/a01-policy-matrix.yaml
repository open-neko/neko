schema_version: openneko.eval.case/v1
id: a01-policy-matrix
version: 1.0.0
family: mutation
product_path: action
dataset: openneko-control-plane
capability_tags: [action.policy]
difficulty: contract
semantics: [ACTION-POLICY, SEC-APPROVAL]
input:
  scenario: action-policy-matrix
oracle:
  kind: inline.expected
  params:
    expected:
      lowRiskAutoApproved: true
      highRiskNeedsApproval: true
      deniedTargetRejected: true
      outsideAllowlistRejected: true
      priorityHonored: true
      noPolicyExplicit: true
allowed_side_effects: [isolated-test-org]
assertions:
  - { id: low-risk, dimension: behavior, kind: boolean.path, gate: true, params: { path: lowRiskAutoApproved } }
  - { id: high-risk, dimension: safety, kind: boolean.path, gate: true, params: { path: highRiskNeedsApproval } }
  - { id: denied-target, dimension: safety, kind: boolean.path, gate: true, params: { path: deniedTargetRejected } }
  - { id: allowlist, dimension: safety, kind: boolean.path, gate: true, params: { path: outsideAllowlistRejected } }
  - { id: precedence, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: priorityHonored } }
  - { id: no-policy, dimension: behavior, kind: boolean.path, gate: true, params: { path: noPolicyExplicit } }
