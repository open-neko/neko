  - { id: op-gt, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: gt } }
  - { id: op-gte, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: gte } }
  - { id: op-lt, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: lt } }
  - { id: op-lte, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: lte } }
  - { id: op-eq, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: eq } }
  - { id: op-ne, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: ne } }
  - { id: non-numeric-safe, dimension: safety, kind: boolean.path, gate: true, params: { path: nonNumericSafe } }
  - { id: changed-initial, dimension: behavior, kind: boolean.path, gate: true, params: { path: changedInitialSafe } }
  - { id: changed-stable, dimension: behavior, kind: boolean.path, gate: true, params: { path: changedStableSafe } }
  - { id: changed-fires, dimension: behavior, kind: boolean.path, gate: true, params: { path: changedFires } }
