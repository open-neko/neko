schema_version: openneko.eval.case/v1
id: w01-condition-matrix
version: 1.0.0
family: watcher
product_path: watcher
dataset: openneko-control-plane
capability_tags: [watcher.condition]
difficulty: contract
semantics: [WATCH-CONDITION]
input:
  scenario: watcher-condition-matrix
oracle:
  kind: inline.expected
  params:
    expected:
      pathObjectArray: true
      pathMissing: true
      gt: true
      gte: true
      lt: true
      lte: true
      eq: true
      ne: true
      nonNumericSafe: true
      changedInitialSafe: true
      changedStableSafe: true
