schema_version: openneko.eval.case/v1
id: a02-action-lifecycle
version: 1.0.0
family: mutation
product_path: action
dataset: openneko-control-plane
capability_tags: [action.approval, action.execution, action.idempotency, audit.chain]
difficulty: stateful
semantics:
  - ACTION-PROPOSE
  - ACTION-APPROVAL
  - ACTION-EXECUTE
  - ACTION-IDEMPOTENCY
  - ACTION-COLLATERAL
  - ACTION-ADAPTER
  - ACTION-AUDIT
  - SEC-APPROVAL
  - SEC-AUDIT-CHAIN
input:
  scenario: action-lifecycle
oracle:
  kind: inline.expected
  params:
    expected:
      proposed: true
      serviceDenied: true
      approved: true
      duplicateApprovalDenied: true
      executed: true
      receipt: true
      atMostOnce: true
      collateralUnchanged: true
      rejectionTerminal: true
      auditValid: true
allowed_side_effects: [isolated-test-org, in-memory-action-adapter]
assertions:
  - { id: proposal, dimension: behavior, kind: boolean.path, gate: true, params: { path: proposed } }
  - { id: service-denied, dimension: safety, kind: boolean.path, gate: true, params: { path: serviceDenied } }
  - { id: approval, dimension: behavior, kind: boolean.path, gate: true, params: { path: approved } }
  - { id: duplicate-approval, dimension: safety, kind: boolean.path, gate: true, params: { path: duplicateApprovalDenied } }
  - { id: execution, dimension: ground_truth, kind: boolean.path, gate: true, params: { path: executed } }
  - { id: receipt, dimension: behavior, kind: boolean.path, gate: true, params: { path: receipt } }
  - { id: at-most-once, dimension: safety, kind: boolean.path, gate: true, params: { path: atMostOnce } }
  - { id: collateral, dimension: safety, kind: boolean.path, gate: true, params: { path: collateralUnchanged } }
  - { id: rejection, dimension: safety, kind: boolean.path, gate: true, params: { path: rejectionTerminal } }
  - { id: audit, dimension: safety, kind: boolean.path, gate: true, params: { path: auditValid } }
