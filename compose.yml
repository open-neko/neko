x-neko-app-env: &neko-app-env
  HOME: /tmp/openneko-home
  TMPDIR: /tmp/openneko-tmp
  XDG_CONFIG_HOME: /config
  XDG_CACHE_HOME: /tmp/openneko-home/.cache
  XDG_DATA_HOME: /tmp/openneko-home/.local/share
  XDG_STATE_HOME: /tmp/openneko-home/.local/state
  NEKO_PG_HOST: neko-db
  NEKO_PG_PORT: "5432"
  NEKO_PG_USER: neko
  NEKO_PG_PASSWORD: secret
  NEKO_PG_DATABASE: neko
  OPENNEKO_RECORDS_GRAPHJIN_URL: http://records-graphjin:8090
  NO_PROXY: localhost,127.0.0.1,::1,neko-db,records-db,neko-backup,records-storage-ops,worker,web,neko-graphjin,records-graphjin,graphjin,adventureworks-db,host.docker.internal,host.internal
  no_proxy: localhost,127.0.0.1,::1,neko-db,records-db,neko-backup,records-storage-ops,worker,web,neko-graphjin,records-graphjin,graphjin,adventureworks-db,host.docker.internal,host.internal

services:
  neko-db:
    # pgvector image — base postgres:16 + the vector extension preinstalled.
    # work_memory.embedding stores 384-dim vectors from transformers.js
    # (Xenova/all-MiniLM-L6-v2) for context-based memory retrieval.
    build:
      context: .
      target: neko-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neko
      PGDATA: /var/lib/postgresql/neko
      OPENNEKO_PGBACKREST_STANZA: openneko-metadata
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:-openneko-development-backup-key-change-me}
    ports:
      - "${OPENNEKO_DB_PORT:-5432}:5432"
    volumes:
      - neko-db-data:/var/lib/postgresql/neko
      - neko-db-socket:/var/run/postgresql
      - ${OPENNEKO_BACKUP_REPOSITORY:-./.openneko/backups}:/var/lib/pgbackrest
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=openneko-metadata archive-push %p
      - -c
      - archive_timeout=60s
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U neko -d neko
      interval: 5s
      timeout: 5s
      retries: 20

  # Business data lives in its own Postgres lifecycle. It starts with the
  # worker so an approved app_create can execute without host-level Docker
  # access or a second, out-of-band operator step.
  records-db:
    build:
      context: .
      target: records-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPENNEKO_RECORDS_PG_USER:-records}
      POSTGRES_PASSWORD: ${OPENNEKO_RECORDS_PG_PASSWORD:-records-secret}
      POSTGRES_DB: ${OPENNEKO_RECORDS_PG_DATABASE:-records}
      PGDATA: /var/lib/postgresql/records
      OPENNEKO_PGBACKREST_STANZA: openneko-records
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:-openneko-development-backup-key-change-me}
    ports:
      - "${OPENNEKO_RECORDS_DB_PORT:-5434}:5432"
    volumes:
      - records-db-data:/var/lib/postgresql/records
      - records-db-socket:/var/run/postgresql
      - ${OPENNEKO_BACKUP_REPOSITORY:-./.openneko/backups}:/var/lib/pgbackrest
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=openneko-records archive-push %p
      - -c
      - archive_timeout=60s
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Encrypted whole-deployment backups: paired pgBackRest base backups for
  # metadata + records, continuous WAL from both database containers, and an
  # encrypted snapshot of the config/GraphJin volumes in one global manifest.
  neko-backup:
    build:
      context: .
      target: neko-backup
    restart: unless-stopped
    depends_on:
      neko-db:
        condition: service_healthy
      records-db:
        condition: service_healthy
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:-openneko-development-backup-key-change-me}
      NEKO_PG_USER: neko
      NEKO_PG_DATABASE: neko
      RECORDS_PG_USER: ${OPENNEKO_RECORDS_PG_USER:-records}
      RECORDS_PG_DATABASE: ${OPENNEKO_RECORDS_PG_DATABASE:-records}
      OPENNEKO_BACKUP_INTERVAL_SEC: ${OPENNEKO_BACKUP_INTERVAL_SEC:-86400}
      OPENNEKO_BACKUP_RETENTION_FULL: ${OPENNEKO_BACKUP_RETENTION_FULL:-7}
      OPENNEKO_BACKUP_RETENTION_DIFF: ${OPENNEKO_BACKUP_RETENTION_DIFF:-4}
    volumes:
      - neko-db-data:/var/lib/postgresql/neko:ro
      - records-db-data:/var/lib/postgresql/records:ro
      - neko-db-socket:/sockets/neko:ro
      - records-db-socket:/sockets/records:ro
      - openneko-config:/snapshots/config:ro
      - openneko-graphjin-cli:/snapshots/graphjin:ro
      - openneko-records-graphjin:/snapshots/records-graphjin:ro
      - ${OPENNEKO_HOST_CONFIG_DIR:-./.openneko/host-config}:/snapshots/host-config:ro
      - ${OPENNEKO_BACKUP_REPOSITORY:-./.openneko/backups}:/var/lib/pgbackrest
    expose:
      - "9470"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9470/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Destructive restore is isolated behind an explicit profile. The host CLI
  # stops dependents and databases before running this one-shot with RW mounts.
  neko-restore:
    profiles: ["ops"]
    build:
      context: .
      target: neko-backup
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:-openneko-development-backup-key-change-me}
      OPENNEKO_BACKUP_RESTORE_MODE: "1"
    volumes:
      - neko-db-data:/restore/neko
      - records-db-data:/restore/records
      - openneko-config:/restore/config
      - openneko-graphjin-cli:/restore/graphjin
      - openneko-records-graphjin:/restore/records-graphjin
      - ${OPENNEKO_HOST_CONFIG_DIR:-./.openneko/host-config}:/restore/host-config
      - ${OPENNEKO_BACKUP_REPOSITORY:-./.openneko/backups}:/var/lib/pgbackrest

  # Capacity observer for the metadata, records, and staging filesystems. Its
  # mounts are read-only and it intentionally has neither database credentials
  # nor the Docker socket, keeping worker backpressure separate from host ops.
  records-storage-ops:
    build:
      context: .
      target: records-storage-ops
    restart: unless-stopped
    volumes:
      - neko-db-data:/volumes/metadata:ro
      - records-db-data:/volumes/records:ro
      - openneko-agent-home:/volumes/staging:ro
    expose:
      - "9465"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9465/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Dedicated records data plane. Its supervisor stays stopped until the
  # worker has generated a complete, live-catalog-derived RBAC config into the
  # shared volume, and stops again around every schema projection.
  records-graphjin:
    build:
      context: .
      target: records-graphjin
    restart: unless-stopped
    depends_on:
      records-db:
        condition: service_healthy
    volumes:
      - openneko-records-graphjin:/config:ro
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/v1/graphql"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: applies SQL migrations to neko-db and exits. Every long-
  # running service (web, worker, neko-graphjin) depends on this completing
  # successfully, so by the time they start the schema is in place.
  neko-migrate:
    build:
      context: .
      target: neko-cli
    restart: "no"
    command: ["migrate"]
    depends_on:
      neko-db:
        condition: service_healthy
    # NEKO_PG_PASSWORD here is the bootstrap fallback only — once /setup
    # rotates the password the openneko CLI's defaultConn reads it from
    # /config/openneko/config.json on the shared volume. Without this volume
    # mount, re-`compose up` after rotation would fail with stale creds.
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      XDG_CONFIG_HOME: /config
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko:ro

  neko-graphjin:
    build:
      context: .
      target: neko-graphjin
    restart: unless-stopped
    depends_on:
      # neko-db must be reachable for graphjin to connect; neko-migrate must
      # have finished so graphjin's schema cache reflects all pending
      # migrations. db_schema_poll_duration: 10s in neko.yml also picks up
      # post-boot migrations, but the explicit dep keeps first-boot
      # deterministic.
      neko-db:
        condition: service_healthy
      neko-migrate:
        condition: service_completed_successfully
    # The custom entrypoint reads the password from /openneko-config/config.json
    # (written by the worker entrypoint + the /setup wizard) on every container
    # start, so password rotation works after a simple `docker compose restart
    # neko-graphjin`. NEKO_PG_PASSWORD here is the bootstrap fallback used the
    # very first time, before config.json exists.
    #
    # OPENNEKO_CONFIG_VOLUME selects the source of /openneko-config. Default is
    # the named volume `openneko-config`, shared with web+worker when they too
    # run in compose. In host-hybrid dev (`pnpm dev:up`), it's overridden to the
    # operator's `$HOME/.config/openneko` so host web/worker and in-Docker
    # graphjin share the same physical config.json without a manual sync.
    environment:
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/openneko-config:ro
    ports:
      - "${OPENNEKO_GRAPHJIN_PORT:-8089}:8089"
    healthcheck:
      # graphjin serves no /health route (it 500s); the GraphQL endpoint
      # answering is the honest readiness signal.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8089/api/v1/graphql"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      target: web
    depends_on:
      # Schema is guaranteed ready by neko-migrate before web boots.
      neko-migrate:
        condition: service_completed_successfully
      neko-graphjin:
        condition: service_started
    environment:
      <<: *neko-app-env
      WORKER_ADMIN_URL: http://worker:4100
      OPENNEKO_RESTART_WEB_ON_PASSWORD_CHANGE: "1"
      OPENNEKO_GRAPHJIN_URL: http://neko-graphjin:8089
    ports:
      - "${OPENNEKO_PORT:-3000}:8080"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    depends_on:
      # Schema is guaranteed ready by neko-migrate before worker boots.
      neko-migrate:
        condition: service_completed_successfully
      records-db:
        condition: service_healthy
      records-storage-ops:
        condition: service_healthy
    environment:
      <<: *neko-app-env
      OPENNEKO_GRAPHJIN_URL: http://neko-graphjin:8089
      RECORDS_PG_HOST: records-db
      RECORDS_PG_PORT: "5432"
      RECORDS_PG_USER: ${OPENNEKO_RECORDS_PG_USER:-records}
      RECORDS_PG_PASSWORD: ${OPENNEKO_RECORDS_PG_PASSWORD:-records-secret}
      RECORDS_PG_DATABASE: ${OPENNEKO_RECORDS_PG_DATABASE:-records}
      OPENNEKO_RECORDS_GRAPHJIN_CONFIG_DIR: /config/records-graphjin
      OPENNEKO_RECORDS_OPS_URL: http://records-storage-ops:9465
      OPENNEKO_BACKUP_URL: http://neko-backup:9470
      # Plugin manifest + per-user secrets live on the openneko-config
      # volume, not under /app (which is read-only-ish post-build). The
      # vendored `openneko` CLI on PATH writes to these same paths, so
      # `openneko install …` from inside the worker hot-loads on the
      # next action_request without a rebuild. Default config dir is
      # /config so secrets land at /config/openneko/secrets.json.
      OPENNEKO_PLUGINS_MANIFEST_PATH: /config/openneko/plugins.json
    expose:
      - "4100"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-records-graphjin:/config/records-graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  neko-db-data:
  neko-db-socket:
  records-db-data:
  records-db-socket:
  openneko-config:
  openneko-graphjin-cli:
  openneko-records-graphjin:
  openneko-agent-home:
  openneko-agent-tmp:
