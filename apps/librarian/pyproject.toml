[project]
name = "neko-librarian"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "docling-slim[extract-core,format-office,format-pdf,models-local]==2.124.0",
  "fastapi==0.116.1",
  "opencv-python-headless==4.14.0.94",
  "python-multipart==0.0.20",
  "torch==2.9.1+cpu; sys_platform == 'linux'",
  "torchvision==0.24.1+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.24.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
