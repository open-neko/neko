# Embedded core compose. The `openneko` binary materializes this and overlays
# dev.yml / demo.yml depending on `openneko start --mode`. Image tags are
# pinned to the binary's release version via the ${OPENNEKO_VERSION} env var
# (set by the supervisor before invoking docker compose). Operators who want
# to build from source should use the repo-root compose.yml instead.
x-neko-app-env: &neko-app-env
  HOME: /tmp/openneko-home
  TMPDIR: /tmp/openneko-tmp
  XDG_CONFIG_HOME: /config
  XDG_CACHE_HOME: /tmp/openneko-home/.cache
  XDG_DATA_HOME: /tmp/openneko-home/.local/share
  XDG_STATE_HOME: /tmp/openneko-home/.local/state
  NEKO_PG_HOST: neko-db
  NEKO_PG_PORT: "5432"
  NEKO_PG_USER: neko
  NEKO_PG_PASSWORD: secret
  NEKO_PG_DATABASE: neko
  OPENNEKO_RECORDS_GRAPHJIN_URL: http://records-graphjin:8090
  NO_PROXY: localhost,127.0.0.1,::1,neko-db,records-db,neko-backup,records-storage-ops,worker,web,neko-graphjin,records-graphjin,records-watch-graphjin,graphjin,adventureworks-db,host.docker.internal,host.internal
  no_proxy: localhost,127.0.0.1,::1,neko-db,records-db,neko-backup,records-storage-ops,worker,web,neko-graphjin,records-graphjin,records-watch-graphjin,graphjin,adventureworks-db,host.docker.internal,host.internal

services:
  neko-db:
    image: ghcr.io/open-neko/neko-db:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neko
      PGDATA: /var/lib/postgresql/neko
      OPENNEKO_PGBACKREST_STANZA: openneko-metadata
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:?OPENNEKO_BACKUP_CIPHER_PASS is required}
    ports:
      - "${OPENNEKO_DB_PORT:-5432}:5432"
    volumes:
      - neko-db-data:/var/lib/postgresql/neko
      - neko-db-socket:/var/run/postgresql
      - ${OPENNEKO_BACKUP_REPOSITORY:?OPENNEKO_BACKUP_REPOSITORY is required}:/var/lib/pgbackrest
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=openneko-metadata archive-push %p
      - -c
      - archive_timeout=60s
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U neko -d neko
      interval: 5s
      timeout: 5s
      retries: 20

  # Business data has an independent Postgres lifecycle but starts with the
  # worker so approved app creation never requires a host-side Docker action.
  records-db:
    image: ghcr.io/open-neko/records-db:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPENNEKO_RECORDS_PG_USER:-records}
      POSTGRES_PASSWORD: ${OPENNEKO_RECORDS_PG_PASSWORD:-records-secret}
      POSTGRES_DB: ${OPENNEKO_RECORDS_PG_DATABASE:-records}
      PGDATA: /var/lib/postgresql/records
      OPENNEKO_PGBACKREST_STANZA: openneko-records
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:?OPENNEKO_BACKUP_CIPHER_PASS is required}
    ports:
      - "${OPENNEKO_RECORDS_DB_PORT:-5434}:5432"
    volumes:
      - records-db-data:/var/lib/postgresql/records
      - records-db-socket:/var/run/postgresql
      - ${OPENNEKO_BACKUP_REPOSITORY:?OPENNEKO_BACKUP_REPOSITORY is required}:/var/lib/pgbackrest
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=openneko-records archive-push %p
      - -c
      - archive_timeout=60s
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  neko-backup:
    image: ghcr.io/open-neko/neko-backup:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      neko-db:
        condition: service_healthy
      records-db:
        condition: service_healthy
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:?OPENNEKO_BACKUP_CIPHER_PASS is required}
      NEKO_PG_USER: neko
      NEKO_PG_DATABASE: neko
      RECORDS_PG_USER: ${OPENNEKO_RECORDS_PG_USER:-records}
      RECORDS_PG_DATABASE: ${OPENNEKO_RECORDS_PG_DATABASE:-records}
      OPENNEKO_BACKUP_INTERVAL_SEC: ${OPENNEKO_BACKUP_INTERVAL_SEC:-86400}
      OPENNEKO_BACKUP_RETENTION_FULL: ${OPENNEKO_BACKUP_RETENTION_FULL:-7}
      OPENNEKO_BACKUP_RETENTION_DIFF: ${OPENNEKO_BACKUP_RETENTION_DIFF:-4}
    volumes:
      - neko-db-data:/var/lib/postgresql/neko:ro
      - records-db-data:/var/lib/postgresql/records:ro
      - neko-db-socket:/sockets/neko:ro
      - records-db-socket:/sockets/records:ro
      - openneko-config:/snapshots/config:ro
      - openneko-graphjin-cli:/snapshots/graphjin:ro
      - openneko-records-graphjin:/snapshots/records-graphjin:ro
      - ${OPENNEKO_HOST_CONFIG_DIR:?OPENNEKO_HOST_CONFIG_DIR is required}:/snapshots/host-config:ro
      - ${OPENNEKO_BACKUP_REPOSITORY:?OPENNEKO_BACKUP_REPOSITORY is required}:/var/lib/pgbackrest
    expose:
      - "9470"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9470/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Destructive restore is available only through the explicit ops profile.
  # The CLI stops every database consumer before running this one-shot.
  neko-restore:
    profiles: ["ops"]
    image: ghcr.io/open-neko/neko-backup:${OPENNEKO_VERSION:-latest}
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${OPENNEKO_BACKUP_CIPHER_PASS:?OPENNEKO_BACKUP_CIPHER_PASS is required}
      OPENNEKO_BACKUP_RESTORE_MODE: "1"
    volumes:
      - neko-db-data:/restore/neko
      - records-db-data:/restore/records
      - openneko-config:/restore/config
      - openneko-graphjin-cli:/restore/graphjin
      - openneko-records-graphjin:/restore/records-graphjin
      - ${OPENNEKO_HOST_CONFIG_DIR:?OPENNEKO_HOST_CONFIG_DIR is required}:/restore/host-config
      - ${OPENNEKO_BACKUP_REPOSITORY:?OPENNEKO_BACKUP_REPOSITORY is required}:/var/lib/pgbackrest

  records-storage-ops:
    image: ghcr.io/open-neko/records-storage-ops:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - neko-db-data:/volumes/metadata:ro
      - records-db-data:/volumes/records:ro
      - openneko-agent-home:/volumes/staging:ro
    expose:
      - "9465"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9465/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Starts only when a complete generated config exists in its private volume;
  # the image entrypoint exits before binding a port if the config is absent.
  records-graphjin:
    image: ghcr.io/open-neko/records-graphjin:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      records-db:
        condition: service_healthy
    volumes:
      - openneko-records-graphjin:/config:ro
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/v1/graphql"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Native durable gj_watch runner. Source mode is isolated from the generated
  # exhaustive legacy RBAC config used by the human/chat records data plane.
  records-watch-graphjin:
    image: ghcr.io/open-neko/records-graphjin:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      records-db:
        condition: service_healthy
    environment:
      OPENNEKO_RECORDS_GRAPHJIN_CONFIG_DIR: /config/watch
    volumes:
      - openneko-records-graphjin:/config:ro
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/v1/graphql"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: applies SQL migrations to neko-db and exits. Every long-
  # running service (web, worker, neko-graphjin) depends on this completing
  # successfully, so by the time they start the schema is in place. Lives
  # in the tiny neko-cli image (just the openneko Go binary + ca-certs +
  # tini, ~80MB) so it spins up fast.
  neko-migrate:
    image: ghcr.io/open-neko/neko-cli:${OPENNEKO_VERSION:-latest}
    restart: "no"
    command: ["migrate"]
    depends_on:
      neko-db:
        condition: service_healthy
    # NEKO_PG_PASSWORD here is the bootstrap fallback only — once /setup
    # rotates the password the openneko CLI's defaultConn reads it from
    # /config/openneko/config.json on the shared volume. Without this volume
    # mount, re-`compose up` after rotation would fail with stale creds.
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      XDG_CONFIG_HOME: /config
    volumes:
      - openneko-config:/config/openneko:ro

  neko-graphjin:
    image: ghcr.io/open-neko/neko-graphjin:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      # neko-db must be reachable for graphjin to connect; neko-migrate must
      # have finished so the schema graphjin caches at boot reflects all
      # pending migrations. The neko.yml config also sets
      # db_schema_poll_duration: 10s so post-boot migrations are picked up
      # automatically, but the explicit dep keeps first-boot deterministic.
      neko-db:
        condition: service_healthy
      neko-migrate:
        condition: service_completed_successfully
    environment:
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
    volumes:
      - openneko-config:/openneko-config:ro
    ports:
      - "${OPENNEKO_GRAPHJIN_PORT:-8089}:8089"
    healthcheck:
      # graphjin serves no /health route (it 500s); the GraphQL endpoint
      # answering is the honest readiness signal.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8089/api/v1/graphql"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ghcr.io/open-neko/neko-web:${OPENNEKO_VERSION:-latest}
    depends_on:
      # Schema is guaranteed ready by neko-migrate before web boots — no
      # need for web's entrypoint to run migrate itself anymore.
      neko-migrate:
        condition: service_completed_successfully
    environment:
      <<: *neko-app-env
      WORKER_ADMIN_URL: http://worker:4100
      OPENNEKO_RESTART_WEB_ON_PASSWORD_CHANGE: "1"
      OPENNEKO_GRAPHJIN_URL: http://neko-graphjin:8089
    ports:
      - "${OPENNEKO_PORT:-3000}:8080"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
    restart: unless-stopped

  worker:
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    depends_on:
      # Same as web: neko-migrate completes before worker starts, so the
      # entrypoint no longer runs migrate.
      neko-migrate:
        condition: service_completed_successfully
      records-db:
        condition: service_healthy
      records-storage-ops:
        condition: service_healthy
      records-graphjin:
        condition: service_started
      records-watch-graphjin:
        condition: service_started
    environment:
      <<: *neko-app-env
      OPENNEKO_GRAPHJIN_URL: http://neko-graphjin:8089
      RECORDS_PG_HOST: records-db
      RECORDS_PG_PORT: "5432"
      RECORDS_PG_USER: ${OPENNEKO_RECORDS_PG_USER:-records}
      RECORDS_PG_PASSWORD: ${OPENNEKO_RECORDS_PG_PASSWORD:-records-secret}
      RECORDS_PG_DATABASE: ${OPENNEKO_RECORDS_PG_DATABASE:-records}
      OPENNEKO_RECORDS_GRAPHJIN_CONFIG_DIR: /config/records-graphjin
      OPENNEKO_RECORDS_WATCH_GRAPHJIN_URL: http://records-watch-graphjin:8090
      OPENNEKO_RECORDS_OPS_URL: http://records-storage-ops:9465
      OPENNEKO_BACKUP_URL: http://neko-backup:9470
      OPENNEKO_PLUGINS_MANIFEST_PATH: /config/openneko/plugins.json
      # Plugin npm packages install into a dedicated dir, isolated from /app's
      # pnpm-managed node_modules. Both the openneko CLI (via env-var pickup
      # in internal/plugin/install/) and the worker plugin-registry's runner
      # resolver use this path.
      OPENNEKO_PLUGIN_INSTALL_DIR: /var/lib/openneko/plugins
    expose:
      - "4100"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-records-graphjin:/config/records-graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-plugins:/var/lib/openneko/plugins
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  neko-db-data:
  neko-db-socket:
  records-db-data:
  records-db-socket:
  openneko-config:
  openneko-graphjin-cli:
  openneko-records-graphjin:
  openneko-agent-home:
  openneko-agent-tmp:
  openneko-plugins:
